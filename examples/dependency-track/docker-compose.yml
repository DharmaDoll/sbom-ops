services:
  dependency-track:
    # Pin the local MVP to the v4 API contract used by this repository.
    # Do not use latest for reproducible validation; plan v5 migration separately.
    image: dependencytrack/bundled:4.14.3
    container_name: dependency-track
    ports:
      - "8080:8080"
    volumes:
      - dependency-track-data:/data
    deploy:
      resources:
        limits:
          memory: 8192m
        reservations:
          memory: 4096m
    restart: unless-stopped

volumes:
  dependency-track-data:
