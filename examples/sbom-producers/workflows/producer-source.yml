name: producer-source
on:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        producer: [npm, uv]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate Source SBOM (no DT or registry credentials)
        env:
          PRODUCER: ${{ matrix.producer }}
        run: |
          mkdir -p out
          sha256sum examples/sbom-producers/npm/package-lock.json examples/sbom-producers/uv/uv.lock > out/locks.sha256
          bash examples/sbom-producers/source.sh "$PRODUCER" > "out/${PRODUCER}-source.cdx.json"
          sha256sum --check out/locks.sha256
          git diff --exit-code -- examples/sbom-producers/npm/package-lock.json examples/sbom-producers/uv/uv.lock
          printf '%s\n' "$GITHUB_SHA" > out/checkout-commit.txt
          sha256sum "out/${PRODUCER}-source.cdx.json" > out/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.producer }}-source
          path: out/
          retention-days: 14
          if-no-files-found: error
