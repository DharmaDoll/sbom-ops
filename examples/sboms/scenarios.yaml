schema_version: 1

target:
  dependency_track_version: 4.14.3
  cyclonedx_versions:
    - "1.5"

scenarios:
  - id: lifecycle-vulnerable-to-updated
    category: lifecycle
    status: implemented
    purpose: Observe identity and Finding changes when vulnerable components are updated or replaced.
    project:
      name: sbom-ops-vulnerable-demo
      version: 0.1.0
    steps:
      - id: vulnerable
        bom: vulnerable-demo.cdx.json
        observe:
          - project
          - components
          - dependency-graph
          - findings
          - vulnerabilities
          - metrics
          - bom-export
      - id: updated
        bom: vulnerable-demo-updated.cdx.json
        observe:
          - project
          - components
          - dependency-graph
          - findings
          - vulnerabilities
          - metrics
          - bom-export

  - id: identity-same-name-different-purl
    category: identity
    status: implemented
    purpose: Distinguish components with identical display coordinates but different ecosystems or PURLs.
    project:
      name: dt-lab-identity-purl
      version: 1.0.0
    steps:
      - id: initial
        bom: identity-same-name-different-purl.cdx.json
        observe:
          - project
          - components
          - dependency-graph
          - findings
          - vulnerabilities
          - bom-export

  - id: identity-missing-purl
    category: identity
    status: implemented
    purpose: Measure matching and UUID stability when PURL is absent and hashes or CPEs are present.
    project:
      name: dt-lab-identity-fallback
      version: 1.0.0
    steps:
      - id: initial
        bom: identity-missing-purl.cdx.json
        observe:
          - project
          - components
          - dependency-graph
          - findings
          - vulnerabilities
          - bom-export

  - id: identity-duplicate-dependency-paths
    category: identity
    status: implemented
    purpose: Observe one component reached through multiple dependency paths without duplicate remediation work.
    project:
      name: dt-lab-identity-paths
      version: 1.0.0
    steps:
      - id: initial
        bom: identity-duplicate-dependency-paths.cdx.json
        observe:
          - project
          - components
          - dependency-graph
          - findings
          - vulnerabilities
          - metrics
          - bom-export

  - id: lifecycle-add-remove-components
    category: lifecycle
    status: implemented
    purpose: Record Component, Finding, and Metrics transitions across add and remove uploads.
    project:
      name: dt-lab-lifecycle-components
      version: 1.0.0
    steps:
      - id: initial
        bom: lifecycle-add-remove-initial.cdx.json
        observe:
          - project
          - components
          - dependency-graph
          - findings
          - vulnerabilities
          - metrics
          - bom-export
      - id: updated
        bom: lifecycle-add-remove-updated.cdx.json
        observe:
          - project
          - components
          - dependency-graph
          - findings
          - vulnerabilities
          - metrics
          - bom-export

  - id: lifecycle-project-versions
    category: lifecycle
    status: implemented
    purpose: Compare UUID and Finding behavior across releases of the same named Project.
    project:
      name: dt-lab-lifecycle-versions
      version: 1.0.0
    steps:
      - id: release-1
        project_version: 1.0.0
        bom: lifecycle-project-version-1.cdx.json
        observe:
          - project
          - components
          - findings
          - vulnerabilities
          - metrics
          - bom-export
      - id: release-2
        project_version: 2.0.0
        bom: lifecycle-project-version-2.cdx.json
        observe:
          - project
          - components
          - findings
          - vulnerabilities
          - metrics
          - bom-export

  - id: portfolio-parent-child
    category: portfolio
    status: planned
    purpose: Measure inherited risk and API responses across parent and child Projects.
    project:
      name: dt-lab-portfolio-parent
      version: 1.0.0
    steps: []

  - id: portfolio-tags-properties
    category: portfolio
    status: planned
    purpose: Evaluate tags and properties as routing and ownership metadata.
    project:
      name: dt-lab-portfolio-metadata
      version: 1.0.0
    steps: []

  - id: portfolio-direct-transitive-graph
    category: portfolio
    status: implemented
    purpose: Compare direct and transitive dependency graph representation.
    project:
      name: dt-lab-dependency-graph
      version: 1.0.0
    steps:
      - id: initial
        bom: portfolio-direct-transitive-graph.cdx.json
        observe:
          - project
          - components
          - direct-components
          - services
          - dependency-graph
          - findings
          - vulnerabilities
          - metrics
          - bom-export

  - id: triage-multiple-sources-aliases
    category: triage
    status: implemented
    purpose: Compare CVE, GHSA, OSV, aliases, and vulnerability source identity.
    project:
      name: dt-lab-triage-aliases
      version: 1.0.0
    steps:
      - id: initial
        bom: triage-multiple-sources-aliases.cdx.json
        observe:
          - project
          - components
          - dependency-graph
          - findings
          - vulnerabilities
          - metrics
          - bom-export

  - id: triage-analysis-states
    category: triage
    status: planned
    purpose: Observe every Analysis state separately from Finding and remediation state.
    project:
      name: dt-lab-triage-analysis
      version: 1.0.0
    steps: []

  - id: triage-vex-round-trip
    category: triage
    status: planned
    purpose: Validate VEX import, Analysis projection, export, and human approval boundaries.
    project:
      name: dt-lab-triage-vex
      version: 1.0.0
    steps: []

  - id: triage-policy-violations
    category: triage
    status: planned
    purpose: Keep vulnerability findings and policy violations as independent workflows.
    project:
      name: dt-lab-triage-policy
      version: 1.0.0
    steps: []

  - id: robustness-invalid-cyclonedx
    category: robustness
    status: planned
    purpose: Capture synchronous schema validation and asynchronous processing failure contracts.
    project:
      name: dt-lab-invalid-cyclonedx
      version: 1.0.0
    steps: []

  - id: robustness-json-xml-equivalence
    category: robustness
    status: planned
    purpose: Compare equivalent supported CycloneDX JSON and XML ingestion results.
    project:
      name: dt-lab-format-equivalence
      version: 1.0.0
    steps: []

  - id: robustness-large-bom
    category: robustness
    status: planned
    purpose: Measure upload, processing, query latency, and response size at controlled scales.
    project:
      name: dt-lab-large-bom
      version: 1.0.0
    steps: []
